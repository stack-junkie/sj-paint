name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run test:files
      - run: npm run test:paint-format
      - run: npm run test:tiff
      - run: npm run build
      - name: Headless drawing workflows
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export PAINT_CHROME_PATH="$(command -v google-chrome)"
            test -n "$PAINT_CHROME_PATH"
          fi
          npm test
      - name: Package Windows app
        if: runner.os == 'Windows'
        run: npm run package:windows
      - name: Verify hidden Windows app
        if: runner.os == 'Windows'
        env:
          SJ_PAINT_TEST_CLIPBOARD: '1'
        run: npm run test:windows
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Verify Linux app-drawer installation
        if: runner.os == 'Linux'
        run: python3 scripts/verify-install-linux.py
      - name: Verify packaged Linux app
        if: runner.os == 'Linux'
        env:
          SJ_PAINT_TEST_CLIPBOARD: '1'
        run: |
          xvfb-run -a sh -eu -c '
            ./release/linux-unpacked/sj-paint --no-sandbox --disable-gpu --inspect=127.0.0.1:9231 --remote-debugging-port=9229 >output/linux-launch.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            ready=false
            for attempt in $(seq 1 120); do
              if curl -fsS http://127.0.0.1:9229/json/list >/dev/null 2>&1 && curl -fsS http://127.0.0.1:9231/json/list >/dev/null 2>&1; then
                ready=true
                break
              fi
              kill -0 "$app_pid"
              sleep 0.25
            done
            test "$ready" = true
            npm run test:linux
          '
      - name: Archive verified Linux app
        if: runner.os == 'Linux'
        run: npm run archive:linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: linux-portable
          path: |
            release/sj-paint-*-linux-x64.tar.gz
            release/sj-paint-*-linux-x64.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: output/
          if-no-files-found: ignore
