name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # Hidden Windows rendering and the expanded public-control suite can exceed
    # 30 minutes. Individual UI/IPC waits remain bounded by the harness.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Python for independent codec and model-free protocol checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install independent test decoders
        run: python -m pip install Pillow==12.3.0 numpy==2.4.3 opencv-python-headless==4.13.0.92
      - run: npm run version:check
      - run: npm run test:files
      - run: npm run test:display
        env:
          SJ_PAINT_TEST_DISPLAY_METRICS: '1'
      - run: npm run test:verification
      - run: npm run test:formats
      - name: AI process, setup and model-free protocol contracts
        shell: bash
        run: |
          export PAINT_AI_PROTOCOL_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          # Native model inference is a separate authorized acceptance lane.
          unset PAINT_AI_TEST_PYTHON PAINT_AI_TEST_MODEL PAINT_AI_TEST_ENCODER PAINT_AI_TEST_DECODER
          npm run test:local-ai
          node --test scripts/windows-generation-capacity.test.mjs scripts/managed-generation-preflight.test.mjs scripts/managed-ai-test-profile.test.mjs
      - run: npm run build
      - name: Headless drawing workflows
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export PAINT_CHROME_PATH="$(command -v google-chrome)"
            test -n "$PAINT_CHROME_PATH"
          fi
          npm test
      - name: Package Windows app
        if: runner.os == 'Windows'
        run: npm run package:windows
      - name: Verify hidden Windows app
        if: runner.os == 'Windows'
        env:
          SJ_PAINT_TEST_CLIPBOARD: '1'
        run: npm run test:windows
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Verify Linux app-drawer installation
        if: runner.os == 'Linux'
        run: python3 scripts/verify-install-linux.py
      - name: Verify packaged Linux app
        if: runner.os == 'Linux'
        env:
          SJ_PAINT_TEST_CLIPBOARD: '1'
        run: |
          xvfb-run -a sh -eu -c '
            ./release/linux-unpacked/sj-paint --no-sandbox --disable-gpu --inspect=127.0.0.1:9231 --remote-debugging-port=9229 >output/linux-launch.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            ready=false
            for attempt in $(seq 1 120); do
              if curl -fsS http://127.0.0.1:9229/json/list >/dev/null 2>&1 && curl -fsS http://127.0.0.1:9231/json/list >/dev/null 2>&1; then
                ready=true
                break
              fi
              kill -0 "$app_pid"
              sleep 0.25
            done
            test "$ready" = true
            npm run test:linux
          '
      - name: Archive verified Linux app
        if: runner.os == 'Linux'
        run: npm run archive:linux
      - name: Verify installed Linux archive through GIO with normal sandbox
        if: runner.os == 'Linux'
        env:
          SJ_PAINT_DISPOSABLE_DISPLAY: '1'
        run: xvfb-run -a python3 scripts/verify-installed-linux.py
      - name: Archive verified Windows app
        if: runner.os == 'Windows'
        run: npm run archive:windows
      - name: Build and verify installed Debian package
        if: runner.os == 'Linux'
        env:
          SJ_PAINT_DISPOSABLE_DISPLAY: '1'
          SJ_PAINT_TEST_SYSTEM_PACKAGE: '1'
        run: |
          cp output/linux-installed-launch.json output/linux-archive-installed-launch.json
          cp output/linux-installed-workflow.json output/linux-archive-installed-workflow.json
          npm run installer:linux
          sudo apt-get install -y --no-install-recommends ./release/sj-paint-*-linux-amd64.deb
          trap 'sudo apt-get remove -y sj-paint' EXIT
          xvfb-run -a python3 scripts/verify-installed-linux.py
      - name: Build Windows installer from verified app
        if: runner.os == 'Windows'
        run: npm run installer:windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: windows-portable
          path: |
            release/sj-paint-*-windows-x64.zip
            release/sj-paint-*-windows-x64.zip.sha256
            release/sj-paint-*-windows-x64-setup.exe
            release/sj-paint-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: linux-portable
          path: |
            release/sj-paint-*-linux-x64.tar.gz
            release/sj-paint-*-linux-x64.tar.gz.sha256
            release/sj-paint-*-linux-amd64.deb
            release/sj-paint-*-linux-amd64.deb.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: output/
          if-no-files-found: ignore
