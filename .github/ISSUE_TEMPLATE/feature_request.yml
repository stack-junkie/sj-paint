name: Feature or parity request
description: Propose an improvement or describe a missing workflow.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: The Microsoft Paint baseline is unfinished. Check PARITY.md for known gaps. Project-specific extensions follow the baseline; early ideas are welcome.
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the drawing or editing workflow and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain the result you want. Alternatives are welcome.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Reference or additional context
      description: For a parity request, include the Microsoft Paint version and a reproducible example when available. Identify project-specific ideas separately.
